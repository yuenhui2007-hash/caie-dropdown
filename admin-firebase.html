<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — CAIE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      max-width: 420px;
      margin: 80px auto;
      padding: 0 20px;
      background: #f5f6f8;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 24px 0;
      color: #1a1a2e;
      text-align: center;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 16px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary {
      background: #3b82f6;
      color: #fff;
      margin-bottom: 10px;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .alert.error { background: #fee2e2; color: #991b1b; display: block; }
    .alert.success { background: #dcfce7; color: #166534; display: block; }
    .alert.info { background: #dbeafe; color: #1e40af; display: block; }
    .hidden { display: none !important; }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="card">
    <h1 id="form-title">Admin Sign In</h1>
    <div id="alert" class="alert"></div>

    <form id="signin-form">
      <label for="si-email">Email</label>
      <input type="email" id="si-email" placeholder="admin@example.com" required>

      <label for="si-password">Password</label>
      <input type="password" id="si-password" placeholder="••••••••" required>

      <button type="submit" class="btn-primary" id="si-btn">Sign In</button>
      <button type="button" class="btn-secondary" onclick="toggleMode()">Create Account</button>
    </form>

    <form id="signup-form" class="hidden">
      <label for="su-name">Full Name</label>
      <input type="text" id="su-name" placeholder="John Doe" required>

      <label for="su-email">Email</label>
      <input type="email" id="su-email" placeholder="john@example.com" required>

      <label for="su-password">Password</label>
      <input type="password" id="su-password" placeholder="Min 6 characters" required minlength="6">

      <button type="submit" class="btn-primary" id="su-btn">Sign Up</button>
      <button type="button" class="btn-secondary" onclick="toggleMode()">Back to Sign In</button>
    </form>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    const SESSION_KEY = 'caie_fb_session';

    function showAlert(msg, type) {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = 'alert ' + type;
    }

    function toggleMode() {
      document.getElementById('signin-form').classList.toggle('hidden');
      document.getElementById('signup-form').classList.toggle('hidden');
      document.getElementById('form-title').textContent =
        document.getElementById('signin-form').classList.contains('hidden') ? 'Create Account' : 'Admin Sign In';
      document.getElementById('alert').className = 'alert';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.innerHTML = loading ? 'Please wait<span class="spinner"></span>' : (btnId === 'si-btn' ? 'Sign In' : 'Sign Up');
    }

    // Check existing session
    auth.onAuthStateChanged(user => {
      if (user) {
        localStorage.setItem(SESSION_KEY, JSON.stringify({ uid: user.uid, email: user.email }));
        // Record login activity
        db.collection('logins').add({
          uid: user.uid,
          email: user.email,
          name: user.displayName || '',
          time: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(() => {});
        window.location.href = 'dashboard-firebase.html';
      }
    });

    document.getElementById('signin-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('si-email').value.trim();
      const password = document.getElementById('si-password').value;
      setLoading('si-btn', true);

      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        // Record login
        db.collection('logins').add({
          uid: cred.user.uid,
          email: cred.user.email,
          name: cred.user.displayName || '',
          time: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(() => {});
        showAlert('Success! Redirecting…', 'success');
        // onAuthStateChanged handles redirect
      } catch (err) {
        showAlert(err.message, 'error');
        setLoading('si-btn', false);
      }
    });

    document.getElementById('signup-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('su-name').value.trim();
      const email = document.getElementById('su-email').value.trim();
      const password = document.getElementById('su-password').value;
      setLoading('su-btn', true);

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('users').doc(cred.user.uid).set({
          name: name,
          email: email,
          role: 'admin',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showAlert('Account created! Redirecting…', 'success');
        // onAuthStateChanged handles redirect
      } catch (err) {
        showAlert(err.message, 'error');
        setLoading('su-btn', false);
      }
    });
  </script>

</body>
</html>
