<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — CAIE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      max-width: 420px;
      margin: 80px auto;
      padding: 0 20px;
      background: #f5f6f8;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 24px 0;
      color: #1a1a2e;
      text-align: center;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 16px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.9; }
    .btn-primary {
      background: #3b82f6;
      color: #fff;
      margin-bottom: 10px;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .alert.error { background: #fee2e2; color: #991b1b; display: block; }
    .alert.success { background: #dcfce7; color: #166534; display: block; }
    .link-row {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
    }
    .link-row a {
      color: #3b82f6;
      text-decoration: none;
      cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="form-title">Admin Sign In</h1>
    <div id="alert" class="alert"></div>

    <!-- Sign In Form -->
    <form id="signin-form">
      <label for="si-email">Email</label>
      <input type="email" id="si-email" placeholder="admin@example.com" required>

      <label for="si-password">Password</label>
      <input type="password" id="si-password" placeholder="••••••••" required>

      <button type="submit" class="btn-primary">Sign In</button>
      <button type="button" class="btn-secondary" onclick="toggleMode()">Create Account</button>
    </form>

    <!-- Sign Up Form -->
    <form id="signup-form" class="hidden">
      <label for="su-name">Full Name</label>
      <input type="text" id="su-name" placeholder="John Doe" required>

      <label for="su-email">Email</label>
      <input type="email" id="su-email" placeholder="john@example.com" required>

      <label for="su-password">Password</label>
      <input type="password" id="su-password" placeholder="Min 6 characters" required minlength="6">

      <button type="submit" class="btn-primary">Sign Up</button>
      <button type="button" class="btn-secondary" onclick="toggleMode()">Back to Sign In</button>
    </form>
  </div>

  <script>
    // Simple localStorage-based auth (demo only — replace with Firebase/Supabase for production)
    const STORAGE_KEY = 'caie_admin_users';
    const SESSION_KEY = 'caie_admin_session';

    function getUsers() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }
    function saveUsers(users) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
    }
    function setSession(user) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ email: user.email, name: user.name, time: Date.now() }));
    }
    function getSession() {
      return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    }

    // Seed a default admin account if none exists
    (function seed() {
      if (getUsers().length === 0) {
        saveUsers([{ name: 'Admin', email: 'admin@caie.com', password: 'admin123' }]);
      }
    })();

    function showAlert(msg, type) {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = 'alert ' + type;
    }

    function toggleMode() {
      document.getElementById('signin-form').classList.toggle('hidden');
      document.getElementById('signup-form').classList.toggle('hidden');
      document.getElementById('form-title').textContent =
        document.getElementById('signin-form').classList.contains('hidden') ? 'Create Account' : 'Admin Sign In';
      document.getElementById('alert').className = 'alert';
    }

    // Redirect if already logged in
    if (getSession()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('signin-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('si-email').value.trim().toLowerCase();
      const password = document.getElementById('si-password').value;
      const user = getUsers().find(u => u.email === email && u.password === password);
      if (!user) {
        showAlert('Invalid email or password.', 'error');
        return;
      }
      setSession(user);
      showAlert('Success! Redirecting…', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 500);
    });

    document.getElementById('signup-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('su-name').value.trim();
      const email = document.getElementById('su-email').value.trim().toLowerCase();
      const password = document.getElementById('su-password').value;
      const users = getUsers();
      if (users.find(u => u.email === email)) {
        showAlert('An account with this email already exists.', 'error');
        return;
      }
      users.push({ name, email, password });
      saveUsers(users);
      showAlert('Account created. You can now sign in.', 'success');
      setTimeout(toggleMode, 800);
    });
  </script>

</body>
</html>
