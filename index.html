<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAIE Qualification Levels</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      max-width: 520px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f5f6f8;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 20px 0;
      color: #1a1a2e;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    select {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      color: #1f2937;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      appearance: none;
    }
    select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }
    select:hover { border-color: #9ca3af; }

    /* Dynamic info panel */
    .info-panel {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: none;
      animation: fadeIn 0.25s ease;
    }
    .info-panel.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .info-panel h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 10px 0;
      color: #1a1a2e;
    }
    .info-panel p {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.6;
      margin: 0;
    }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .tag.checkpoint { background: #dbeafe; color: #1e40af; }
    .tag.igcse      { background: #dcfce7; color: #166534; }
    .tag.o-level    { background: #fef3c7; color: #92400e; }
    .tag.as-level   { background: #f3e8ff; color: #6b21a8; }
    .tag.a2-level   { background: #ffe4e6; color: #9f1239; }

    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
    .admin-link {
      text-align: center;
      margin-top: 12px;
    }
    .admin-link a {
      font-size: 13px;
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
    }
    .admin-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Select Your Programme</h1>
    <label for="subject-level">Select Subject Level</label>
    <select id="subject-level" name="subject-level">
      <option value="" disabled selected>Choose a level…</option>
      <option value="alevel">A Level</option>
      <option value="igcse">IGCSE</option>
      <option value="ielts">IELTS</option>
    </select>
    <p class="note">
      Choose your programme to view details and requirements.
    </p>
    <div class="admin-link">
      <a href="admin-firebase.html">🔐 Admin Panel</a>
    </div>
  </div>

  <!-- Dynamic frontend panel -->
  <div id="info-panel" class="info-panel">
    <div id="info-tag" class="tag"></div>
    <h2 id="info-title"></h2>
    <p id="info-desc"></p>
  </div>

  <script>
    const data = {
      alevel: {
        title: 'A Level',
        tag: 'Advanced Level',
        tagClass: 'a2-level',
        desc: 'A Level is a subject-based qualification for students typically aged 16–19. It is widely recognised for university entrance and provides in-depth knowledge in chosen subjects.'
      },
      igcse: {
        title: 'International General Certificate of Secondary Education',
        tag: 'Upper Secondary',
        tagClass: 'igcse',
        desc: 'IGCSE is a popular international qualification for 14–16 year olds. It develops learner knowledge, understanding, and skills across a wide range of subjects.'
      },
      ielts: {
        title: 'International English Language Testing System',
        tag: 'Language Proficiency',
        tagClass: 'checkpoint',
        desc: 'IELTS is the world\'s most popular English language proficiency test for higher education and global migration. It assesses listening, reading, writing, and speaking skills.'
      }
    };

    const select = document.getElementById('subject-level');
    const panel = document.getElementById('info-panel');
    const tagEl = document.getElementById('info-tag');
    const titleEl = document.getElementById('info-title');
    const descEl = document.getElementById('info-desc');

    select.addEventListener('change', () => {
      const key = select.value;
      if (!key || !data[key]) {
        panel.classList.remove('active');
        return;
      }
      const info = data[key];
      tagEl.textContent = info.tag;
      tagEl.className = 'tag ' + info.tagClass;
      titleEl.textContent = info.title;
      descEl.textContent = info.desc;
      panel.classList.add('active');
    });
  </script>

</body>
</html>
