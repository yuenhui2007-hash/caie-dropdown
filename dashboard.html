<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CAIE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f6f8;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
      color: #1a1a2e;
    }
    .btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: center;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 13px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    th {
      font-weight: 600;
      color: #374151;
      background: #f9fafb;
    }
    td { color: #4b5563; }
    tr:hover td { background: #f9fafb; }
    .empty { text-align: center; color: #9ca3af; padding: 40px; }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>CAIE Admin Dashboard</h1>
    <div>
      <button class="btn btn-secondary" onclick="goHome()">Home</button>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-value" id="stat-users">0</div>
      <div class="stat-label">Total Users</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="stat-logins">0</div>
      <div class="stat-label">Logins Today</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="stat-signups">0</div>
      <div class="stat-label">Sign-ups Today</div>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:16px; font-weight:600; margin:0 0 16px 0; color:#1a1a2e;">Registered Users</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Registered</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="users-table">
        <tr><td colspan="4" class="empty">No users found.</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2 style="font-size:16px; font-weight:600; margin:0 0 16px 0; color:#1a1a2e;">Login History</h2>
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Email</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="logins-table">
        <tr><td colspan="3" class="empty">No login records yet.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const SESSION_KEY = 'caie_admin_session';
    const STORAGE_KEY = 'caie_admin_users';
    const LOGINS_KEY  = 'caie_admin_logins';

    function getUsers() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }
    function getLogins() {
      return JSON.parse(localStorage.getItem(LOGINS_KEY) || '[]');
    }
    function getSession() {
      return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    }

    // Redirect if not logged in
    if (!getSession()) {
      window.location.href = 'admin.html';
    }

    function formatDate(ts) {
      const d = new Date(ts);
      return d.toLocaleString();
    }

    function isToday(ts) {
      const d = new Date(ts);
      const now = new Date();
      return d.toDateString() === now.toDateString();
    }

    function render() {
      const users = getUsers();
      const logins = getLogins();

      document.getElementById('stat-users').textContent = users.length;
      document.getElementById('stat-logins').textContent = logins.filter(l => isToday(l.time)).length;
      // Sign-ups today = users registered today (approximate by checking if registeredAt is today, fallback to now for seeded)
      document.getElementById('stat-signups').textContent = users.filter(u => u.registeredAt && isToday(u.registeredAt)).length;

      // Users table
      const usersBody = document.getElementById('users-table');
      if (users.length === 0) {
        usersBody.innerHTML = '<tr><td colspan="4" class="empty">No users found.</td></tr>';
      } else {
        usersBody.innerHTML = users.map(u => `
          <tr>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.registeredAt ? formatDate(u.registeredAt) : '—'}</td>
            <td><span class="tag">Active</span></td>
          </tr>
        `).join('');
      }

      // Logins table
      const loginsBody = document.getElementById('logins-table');
      const sortedLogins = [...logins].sort((a,b) => b.time - a.time).slice(0, 50);
      if (sortedLogins.length === 0) {
        loginsBody.innerHTML = '<tr><td colspan="3" class="empty">No login records yet.</td></tr>';
      } else {
        loginsBody.innerHTML = sortedLogins.map(l => `
          <tr>
            <td>${l.name || '—'}</td>
            <td>${l.email}</td>
            <td>${formatDate(l.time)}</td>
          </tr>
        `).join('');
      }
    }

    function logout() {
      localStorage.removeItem(SESSION_KEY);
      window.location.href = 'admin.html';
    }

    function goHome() {
      window.location.href = 'index.html';
    }

    render();
  </script>

</body>
</html>
